<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picker UI — Gapless Timeline v2</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --hair:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --s-picking:#2a78d6; --s-break:#eb6834; --s-restock:#1baf7a;
  --s-assist:#eda100; --s-repacking:#e87ba4;
  --s-unassigned:#fab219; --s-awaiting:#a8a79f; --s-offline:#62636c;
  --good:#0ca30c; --critical:#d03b3b; --warn:#fab219;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--plane);
  color:var(--ink-1);padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.wrap{width:100%;max-width:1080px}
h1.page{font-size:19px;font-weight:650;letter-spacing:-.01em}
p.page{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}

.frame{width:100%;aspect-ratio:4/3;background:var(--surface-1);border:1px solid var(--ring);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}

.statusbar{display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink-2);flex-shrink:0}
.who{font-weight:650;color:var(--ink-1);font-size:14px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:650;color:#fff;letter-spacing:.02em}
.shiftclock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}

.ribbon-wrap{padding:9px 16px 11px;border-bottom:1px solid var(--hair);flex-shrink:0}
.ribbon-head{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-muted);
  margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.ribbon{display:flex;height:11px;border-radius:3px;overflow:hidden;gap:2px}
.seg{height:100%;border-radius:2px;min-width:3px}

.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;text-align:center;padding:20px}
.hello{font-size:15px;color:var(--ink-2)}
.bigname{font-size:38px;font-weight:680;letter-spacing:-.02em}
.datetxt{font-size:14px;color:var(--ink-muted);margin-bottom:26px}
.btn-xl{border:none;border-radius:12px;padding:24px 64px;font-size:22px;font-weight:680;
  color:#fff;background:var(--s-picking);cursor:pointer;font-family:inherit;min-height:76px}
.note{font-size:12.5px;color:var(--ink-muted);margin-top:22px;max-width:400px;line-height:1.55}

.ordbar{display:flex;align-items:baseline;gap:12px;padding:11px 26px;background:var(--plane);
  border-bottom:1px solid var(--hair);flex-shrink:0}
.ordno{font-weight:680;font-size:15px}
.ordcust{font-size:13px;color:var(--ink-2);flex:1}
.ordprog{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pickbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 26px}
.itemcode{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.itemname{font-size:16px;color:var(--ink-2);margin-top:7px}
.locrow{display:flex;gap:12px;margin-top:20px}
.locbox{border:2px solid var(--s-restock);border-radius:10px;padding:11px 18px;background:#eefaf6}
.locbox .lbl,.qtybox .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-2);font-weight:650}
.locbox .val,.qtybox .val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.15;margin-top:2px}
.qtybox{border:2px solid var(--baseline);border-radius:10px;padding:11px 18px}
.pickfoot{display:flex;gap:12px;padding:16px 26px 20px;flex-shrink:0}
.btn{border:none;border-radius:11px;font-size:17px;font-weight:670;cursor:pointer;
  font-family:inherit;min-height:66px;padding:0 26px}
.btn-primary{background:var(--s-picking);color:#fff;flex:1}
.btn-ghost{background:var(--surface-1);border:2px solid var(--baseline);color:var(--ink-2)}
.btn-done{background:var(--good);color:#fff;flex:1}

.modal-bg{position:absolute;inset:0;background:rgba(11,11,11,.55);display:flex;
  align-items:center;justify-content:center;padding:26px;z-index:5}
.modal{background:var(--surface-1);border-radius:14px;padding:24px;width:100%;max-width:610px}
.modal h2{font-size:23px;font-weight:680;letter-spacing:-.015em}
.modal .sub{font-size:13.5px;color:var(--ink-2);margin-top:5px;margin-bottom:18px}
.act-primary{width:100%;border:none;border-radius:11px;background:var(--s-picking);color:#fff;
  font-size:20px;font-weight:680;min-height:78px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:11px}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.act-btn{border:2px solid;border-radius:11px;background:var(--surface-1);font-size:16px;
  font-weight:670;min-height:68px;cursor:pointer;font-family:inherit;display:flex;
  align-items:center;justify-content:center;gap:9px;color:var(--ink-1)}
.swatch{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.modal .foot{font-size:12px;color:var(--ink-muted);margin-top:15px;text-align:center;line-height:1.5}

.timer-screen{flex:1;display:flex;flex-direction:column}
.timer-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tglyph{font-size:52px;line-height:1}
.tlabel{font-size:26px;font-weight:680;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.tclock{font-size:100px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  line-height:1.02;margin:4px 0}
.tstart{font-size:13.5px;color:var(--ink-2)}
.switch-strip{border-top:1px solid var(--hair);padding:13px 26px 18px;flex-shrink:0}
.switch-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);
  font-weight:650;margin-bottom:9px}
.switch-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border:2px solid;border-radius:10px;background:var(--surface-1);cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:660;min-height:60px;color:var(--ink-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 4px}

.hatch-bg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.warnbadge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;
  font-size:13px;font-weight:700;letter-spacing:.02em}
.uask{font-size:17px;font-weight:640;margin-top:14px}
.uhint{font-size:12.5px;color:var(--ink-2);margin-top:5px;max-width:440px;text-align:center;line-height:1.5}

.rev-head{padding:16px 26px 12px;border-bottom:1px solid var(--hair);flex-shrink:0}
.rev-head h2{font-size:21px;font-weight:680;letter-spacing:-.015em}
.rev-head p{font-size:13px;color:var(--ink-2);margin-top:4px}
.rev-list{flex:1;overflow-y:auto;padding:14px 26px}
.rev-card{border:1px solid var(--hair);border-radius:11px;padding:13px 15px;margin-bottom:10px}
.rev-card.done{border-color:var(--good);background:#f2fbf2}
.rev-card.esc{border-color:var(--warn);background:#fffbee}
.rev-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rev-time{font-size:16px;font-weight:680;font-variant-numeric:tabular-nums}
.rev-dur{font-size:13px;color:var(--ink-2)}
.rev-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:2px solid;border-radius:9px;background:var(--surface-1);cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:650;padding:9px 13px;min-height:44px;
  display:inline-flex;align-items:center;gap:7px;color:var(--ink-1)}
.chip.skip{border-color:var(--baseline);color:var(--ink-muted)}
.rev-answer{font-size:14px;font-weight:660;display:flex;align-items:center;gap:8px}
.rev-foot{padding:13px 26px 17px;border-top:1px solid var(--hair);display:flex;gap:12px;
  align-items:center;flex-shrink:0}
.escnote{flex:1;font-size:12.5px;color:var(--ink-2);line-height:1.45}

.sum-body{flex:1;overflow-y:auto;padding:18px 26px 22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.tile{border:1px solid var(--hair);border-radius:11px;padding:13px 15px}
.tile .tl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:650}
.tile .tv{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1}
.tile .td{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;align-items:center;gap:5px}
.ok{color:var(--good);font-weight:650}
.chart-title{font-size:14.5px;font-weight:670;margin-bottom:3px}
.chart-sub{font-size:12px;color:var(--ink-2);margin-bottom:11px}
.stack{display:flex;height:34px;border-radius:4px;overflow:hidden;gap:2px}
.stack .sseg{display:flex;align-items:center;justify-content:center;min-width:2px}
.stack .sseg span{font-size:11.5px;font-weight:700;color:#fff}
.stack .sseg.dark-txt span{color:#3d2b00}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.lg b{color:var(--ink-1);font-weight:650;font-variant-numeric:tabular-nums}
table.tv{width:100%;border-collapse:collapse;margin-top:16px;font-size:12.5px}
table.tv th{text-align:left;font-weight:650;color:var(--ink-2);padding:7px 8px;
  border-bottom:1px solid var(--baseline);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
table.tv td{padding:7px 8px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
table.tv td.n{text-align:right}
table.tv tr.tot td{font-weight:700;border-top:1px solid var(--baseline);border-bottom:none}
.owner{font-size:11px;color:var(--ink-muted)}

.sup-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--hair);
  border-radius:10px;margin-bottom:9px}
.sup-row .m{flex:1;font-size:13.5px}
.sup-row .m b{font-weight:660}

.nav{display:flex;flex-wrap:wrap;gap:7px;width:100%;max-width:1080px}
.nav button{border:1px solid var(--ring);background:var(--surface-1);border-radius:8px;
  padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)}
.nav button.on{background:var(--ink-1);color:#fff;border-color:var(--ink-1)}
.caption{font-size:12.5px;color:var(--ink-2);max-width:1080px;width:100%;line-height:1.55;
  border-left:2px solid var(--hair);padding-left:12px}
.caption b{color:var(--ink-1);font-weight:650}
code{font-size:11.5px;background:var(--plane);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>

<div class="wrap">
  <h1 class="page">Picker UI — gapless timeline <span style="color:var(--ink-muted);font-weight:500">v2</span></h1>
  <p class="page">Check-in now prompts for an activity, "waiting for work" is its own state, and unresolved blocks escalate instead of vanishing.</p>
</div>

<div class="frame">
  <div class="statusbar">
    <span class="who">Arslan</span>
    <span class="conn"><span class="dot"></span>Synced</span>
    <span class="spacer"></span>
    <span class="shiftclock" id="shiftClock">Shift 04:12:38</span>
    <span class="pill" id="statePill"><span class="glyph">▶</span><span id="stateTxt">PICKING</span></span>
  </div>
  <div class="ribbon-wrap" id="ribbonWrap">
    <div class="ribbon-head"><span>Shift timeline · 08:00 → now</span><span>every minute owned</span></div>
    <div class="ribbon" id="ribbon"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<div class="nav" id="nav"></div>
<div class="caption" id="caption"></div>

<script>
const H45 = (c,l)=>`repeating-linear-gradient(45deg,${c} 0 5px,${l} 5px 10px)`;
const H135= (c,l)=>`repeating-linear-gradient(135deg,${c} 0 5px,${l} 5px 10px)`;

const C = {
  picking:   {c:'#2a78d6', g:'▶', n:'Pick Orders', short:'Picking',    own:'—'},
  break:     {c:'#eb6834', g:'▌▌',n:'Break',       short:'Break',      own:'—'},
  restock:   {c:'#1baf7a', g:'▣', n:'Restock',     short:'Restock',    own:'—'},
  assist:    {c:'#eda100', g:'▲', n:'Assist',      short:'Assist',     own:'—'},
  repacking: {c:'#e87ba4', g:'◱', n:'Repacking',   short:'Repacking',  own:'—'},
  awaiting:  {c:'#a8a79f', g:'◷', n:'Waiting for work', short:'Awaiting order', own:'Planning',
              fill:H135('#a8a79f','#e8e7e1'), ink:'#3a3a36'},
  unassigned:{c:'#fab219', g:'⚠', n:'Not logged',  short:'Unassigned', own:'Picker',
              fill:H45('#fab219','#fff5d6'), ink:'#3d2b00'},
  offline:   {c:'#62636c', g:'⊘', n:'Offline',     short:'Offline',    own:'IT'}
};
const ACTS = ['break','restock','assist','repacking'];
const fillOf = k => C[k].fill ? `background-image:${C[k].fill}` : `background:${C[k].c}`;

const TL = [['unassigned',4],['picking',52],['break',9],['picking',64],['awaiting',22],
  ['picking',41],['restock',18],['picking',37],['unassigned',11],['picking',29],['assist',11],['picking',24]];

let screen='checkin', t0=Date.now(), timerState='break', escalated=0, resolved=0;

const fmt=s=>{const h=s/3600|0,m=(s%3600)/60|0,x=s%60|0;
  return [h,m,x].map(v=>String(v|0).padStart(2,'0')).join(':')};

function ribbon(){
  document.getElementById('ribbon').innerHTML = TL.map(([k,m])=>
    `<div class="seg" style="flex:${m};${fillOf(k)}" title="${C[k].short} ${m}m"></div>`).join('');
}
function setPill(k){
  const p=document.getElementById('statePill');
  p.style.cssText = C[k].fill ? `background-image:${C[k].fill};color:${C[k].ink}` : `background:${C[k].c};color:#fff`;
  p.querySelector('.glyph').textContent=C[k].g;
  document.getElementById('stateTxt').textContent=C[k].short.toUpperCase();
}

const CAPS = {
 checkin:'<b>Check In.</b> The first segment opens at <code>check_in_time</code>. Nothing is assumed about what comes next — the picker is asked.',
 startmodal:'<b>Your first fix.</b> Check-in now hands straight to the activity picker, with Pick Orders first. Previously the picker was dropped into a picking screen that assumed an order was waiting — if none was, they sat in silent unassigned time. Tapping here within the 90s grace window relabels the segment back to <code>check_in_time</code>, so a normal start leaves no crumb at all.',
 awaiting:'<b>Waiting for work — a state of its own.</b> The picker tapped Pick Orders and the queue was empty. That is not their idle time and it must not be scored as unassigned. It is attributed to <b>Planning</b>, and it answers the question a supervisor actually has: is this picker slow, or am I not feeding them orders?',
 picking:'<b>Picking.</b> Item code is the largest element — it is what gets matched against the shelf.',
 modal:'<b>After Packing Complete.</b> Same picker, same modal. The segment already switched server-side, so this labels time rather than holding it.',
 timer:'<b>Activity mode.</b> All five switch targets always visible — leaving an activity is one tap.',
 unassigned:'<b>The state that replaces NULL.</b> Hatched, amber, counting, and owned by the picker. It never blocks work — Pick Orders is right there — but it is a number their supervisor sees.',
 review:'<b>Your second fix — nothing silently vanishes.</b> "Can\'t recall" is allowed, because forcing a label produces fiction. But it does not close the block: it escalates. The picker always leaves on time; the <i>record</i> stays open. Note the button text changes to name the consequence.',
 supervisor:'<b>Where unresolved blocks land.</b> The shift sits at <code>pending_review</code> until every block reaches a terminal state — classified, or explicitly written off with a reason. Auto-write-off after 7 days stops it blocking reporting forever. This is the enforcement: not on the person, on the record.',
 summary:'<b>Shift summary.</b> Every column sums to the shift. Each non-productive state names its owner, so the number routes to whoever can act on it.'
};

function render(){
  const s=document.getElementById('screen');
  document.getElementById('ribbonWrap').style.display = screen==='checkin'?'none':'block';
  document.getElementById('caption').innerHTML=CAPS[screen]||'';
  const bar = document.getElementById('statePill');
  bar.style.display = screen==='checkin'?'none':'inline-flex';
  document.getElementById('shiftClock').style.display = screen==='checkin'?'none':'inline';

  if(screen==='checkin'){
    s.innerHTML=`<div class="center">
      <div class="hello">Wednesday 19 August · 07:58</div>
      <div class="bigname">Arslan</div>
      <div class="datetxt">Picker · Warehouse 777</div>
      <button class="btn-xl" onclick="go('startmodal')">Check In</button>
      <div class="note">Your timeline starts the moment you check in. You'll be asked what you're starting with.</div>
    </div>`; return;
  }

  if(screen==='startmodal'){
    setPill('unassigned');
    s.innerHTML=`<div class="center" style="opacity:.2"><div class="bigname">Arslan</div></div>
      <div class="modal-bg"><div class="modal">
        <h2>Checked in · 08:00</h2>
        <div class="sub">What are you starting with?</div>
        <button class="act-primary" onclick="go('awaiting')">
          <span class="swatch" style="background:#fff"></span>Pick Orders</button>
        <div class="act-grid">${ACTS.map(k=>`<button class="act-btn" style="border-color:${C[k].c}"
          onclick="startTimer('${k}')"><span class="swatch" style="background:${C[k].c}"></span>${C[k].n}</button>`).join('')}</div>
        <div class="foot">Tap within 90 seconds and your whole shift counts from 08:00.</div>
      </div></div>`; return;
  }

  if(screen==='awaiting'){
    setPill('awaiting');
    s.innerHTML=`<div class="timer-screen">
      <div class="hatch-bg" style="background-image:${H135('#f4f3ee','#fbfbf8')}">
        <div class="warnbadge" style="background:${C.awaiting.c};color:#fff">◷ NO ORDERS IN QUEUE</div>
        <div class="tclock" id="tclock" style="font-size:88px">00:00:00</div>
        <div class="uask">You're ready — we don't have work for you yet</div>
        <div class="uhint">This time is logged against order planning, not against you. We'll alert you the moment an order lands.</div>
      </div>
      <div class="switch-strip">
        <div class="switch-lbl">Or do something else</div>
        <div class="switch-row">
          <button class="sw" style="border-color:${C.picking.c}" onclick="go('picking')">
            <span class="swatch" style="background:${C.picking.c}"></span>Order arrived</button>
          ${ACTS.map(a=>`<button class="sw" style="border-color:${C[a].c}" onclick="startTimer('${a}')">
            <span class="swatch" style="background:${C[a].c}"></span>${C[a].short}</button>`).join('')}
        </div>
      </div></div>`; return;
  }

  if(screen==='picking'){
    setPill('picking');
    s.innerHTML=`<div class="ordbar"><span class="ordno">IN10057214</span>
        <span class="ordcust">ARODASI KIOSK LTD · Nicosia</span>
        <span class="ordprog">Item 7 of 10</span></div>
      <div class="pickbody">
        <div class="itemcode">CHO-0144</div>
        <div class="itemname">Chocolate bar assorted · case of 24</div>
        <div class="locrow">
          <div class="locbox"><div class="lbl">Location</div><div class="val">09-01-B 03</div></div>
          <div class="qtybox"><div class="lbl">Quantity</div><div class="val">4 cases</div></div>
        </div></div>
      <div class="pickfoot">
        <button class="btn btn-ghost" onclick="go('picking')">Skip</button>
        <button class="btn btn-primary" onclick="go('picking')">Picked</button>
        <button class="btn btn-done" onclick="go('modal')">Packing Complete</button>
      </div>`; return;
  }

  if(screen==='modal'){
    setPill('unassigned');
    s.innerHTML=`<div class="ordbar"><span class="ordno">IN10057214</span>
        <span class="ordcust">ARODASI KIOSK LTD</span><span class="ordprog">10 of 10 — complete</span></div>
      <div class="pickbody" style="opacity:.2"><div class="itemcode">CHO-0121</div></div>
      <div class="modal-bg"><div class="modal">
        <h2>Order complete</h2><div class="sub">What are you doing next?</div>
        <button class="act-primary" onclick="go('picking')">
          <span class="swatch" style="background:#fff"></span>Pick Orders</button>
        <div class="act-grid">${ACTS.map(k=>`<button class="act-btn" style="border-color:${C[k].c}"
          onclick="startTimer('${k}')"><span class="swatch" style="background:${C[k].c}"></span>${C[k].n}</button>`).join('')}</div>
        <div class="foot">Timer already running — tap within 90s and it counts from when the order closed.</div>
      </div></div>`; return;
  }

  if(screen==='timer'||screen==='unassigned'){
    const un = screen==='unassigned', k = un?'unassigned':timerState;
    setPill(k);
    const body = un
      ? `<div class="hatch-bg" style="background-image:${H45('#fffbee','#fff7dd')}">
           <div class="warnbadge" style="background:${C.unassigned.c};color:${C.unassigned.ink}">⚠ NOT LOGGED</div>
           <div class="tclock" id="tclock" style="font-size:88px">00:00:00</div>
           <div class="uask">What are you doing?</div>
           <div class="uhint">Recorded either way. Telling us keeps it out of your unassigned total.</div></div>`
      : `<div class="timer-main">
           <div class="tglyph" style="color:${C[k].c}">${C[k].g}</div>
           <div class="tlabel" style="color:${C[k].c}">${C[k].short}</div>
           <div class="tclock" id="tclock">00:00:00</div>
           <div class="tstart">Started 14:23 · logged automatically</div></div>`;
    s.innerHTML=`<div class="timer-screen">${body}
      <div class="switch-strip">
        <div class="switch-lbl">${un?'Log this time as':'Switch to'}</div>
        <div class="switch-row">
          <button class="sw" style="border-color:${C.picking.c}" onclick="go('picking')">
            <span class="swatch" style="background:${C.picking.c}"></span>Pick Orders</button>
          ${ACTS.filter(a=>un||a!==k).map(a=>`<button class="sw" style="border-color:${C[a].c}"
            onclick="startTimer('${a}')"><span class="swatch" style="background:${C[a].c}"></span>${C[a].short}</button>`).join('')}
          ${un?'':`<button class="sw" style="border-color:var(--baseline);color:var(--ink-2)" onclick="go('review')">
            <span class="swatch" style="background:var(--ink-muted)"></span>End Shift</button>`}
        </div>
      </div></div>`; return;
  }

  if(screen==='review'){
    setPill('unassigned'); escalated=0; resolved=0;
    const blocks=[{id:0,t:'09:14 – 09:20',m:6},{id:1,t:'11:47 – 12:01',m:14},{id:2,t:'15:22 – 15:26',m:4}];
    s.innerHTML=`
      <div class="rev-head"><h2>Before you go</h2>
        <p>3 blocks weren't logged today — 24 minutes. Tell us what they were.</p></div>
      <div class="rev-list">${blocks.map(b=>`<div class="rev-card" id="rc${b.id}">
        <div class="rev-top"><span class="rev-time">${b.t}</span><span class="rev-dur">${b.m} min</span></div>
        <div class="rev-chips" id="rch${b.id}">
          ${ACTS.map(a=>`<button class="chip" style="border-color:${C[a].c}" onclick="label(${b.id},'${a}')">
            <span class="swatch" style="background:${C[a].c}"></span>${C[a].short}</button>`).join('')}
          <button class="chip" style="border-color:${C.awaiting.c}" onclick="label(${b.id},'awaiting')">
            <span class="swatch" style="background:${C.awaiting.c}"></span>No orders</button>
          <button class="chip skip" onclick="label(${b.id},null)">Can't recall</button>
        </div></div>`).join('')}</div>
      <div class="rev-foot">
        <span class="escnote" id="escnote">Anything you can't recall goes to your supervisor — it won't be quietly dropped.</span>
        <button class="btn btn-done" style="flex:0 0 auto" id="coBtn" onclick="go('supervisor')">Check Out</button>
      </div>`; return;
  }

  if(screen==='supervisor'){
    setPill('unassigned');
    s.innerHTML=`<div class="rev-head"><h2>Supervisor · review queue</h2>
        <p>Shift 493 — Arslan — status <code>pending_review</code>. Closes when every block is terminal.</p></div>
      <div class="rev-list">
        <div class="sup-row"><span class="swatch" style="${fillOf('unassigned')};width:16px;height:16px"></span>
          <span class="m"><b>11:47 – 12:01</b> · 14 min · picker couldn't recall</span>
          <button class="chip" style="border-color:${C.restock.c}"><span class="swatch" style="background:${C.restock.c}"></span>Restock</button>
          <button class="chip skip">Write off</button></div>
        <div class="sup-row"><span class="swatch" style="${fillOf('unassigned')};width:16px;height:16px"></span>
          <span class="m"><b>15:22 – 15:26</b> · 4 min · picker couldn't recall</span>
          <button class="chip" style="border-color:${C.assist.c}"><span class="swatch" style="background:${C.assist.c}"></span>Assist</button>
          <button class="chip skip">Write off</button></div>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:16px;line-height:1.55;
          border-left:2px solid var(--warn);padding-left:12px">
          Unreviewed blocks auto-write-off after <b>7 days</b> and the shift closes, so reporting is never blocked
          indefinitely. Written-off time still counts as unassigned — it is resolved, not erased.</div>
      </div>
      <div class="rev-foot"><span class="escnote">2 of 2 blocks pending</span>
        <button class="btn btn-done" style="flex:0 0 auto" onclick="go('summary')">Close shift</button></div>`; return;
  }

  if(screen==='summary'){
    setPill('picking');
    const rows=[['picking',247],['awaiting',22],['restock',18],['break',16],['assist',11],['unassigned',18],['offline',0]];
    const tot=rows.reduce((a,b)=>a+b[1],0);
    s.innerHTML=`<div class="sum-body">
      <div class="tiles">
        <div class="tile"><div class="tl">Items picked</div><div class="tv">270</div><div class="td">8 orders</div></div>
        <div class="tile"><div class="tl">Occupancy</div><div class="tv">74%</div><div class="td"><span class="ok">▲</span> target 65%</div></div>
        <div class="tile"><div class="tl">Unassigned</div><div class="tv">5.4%</div><div class="td"><span class="ok">▼</span> from 53% in Aug</div></div>
        <div class="tile"><div class="tl">Accounted</div><div class="tv">100%</div><div class="td"><span class="ok">✓</span> 0 gaps</div></div>
      </div>
      <div class="chart-title">Where the shift went</div>
      <div class="chart-sub">332 minutes · 08:00 – 13:32 · every minute belongs to exactly one state</div>
      <div class="stack">${rows.filter(r=>r[1]>0).map(([k,m])=>{
        const pct=m/tot*100;
        return `<div class="sseg${C[k].fill?' dark-txt':''}" style="flex:${m};${fillOf(k)}">${pct>6?`<span>${m}m</span>`:''}</div>`}).join('')}</div>
      <div class="legend">${rows.filter(r=>r[1]>0).map(([k,m])=>`<span class="lg">
        <span class="swatch" style="${fillOf(k)}"></span>${C[k].short} <b>${m}m</b></span>`).join('')}</div>
      <table class="tv">
        <tr><th>State</th><th>Owner</th><th style="text-align:right">Minutes</th><th style="text-align:right">Share</th></tr>
        ${rows.map(([k,m])=>`<tr><td>${C[k].short}</td><td class="owner">${C[k].own}</td>
          <td class="n">${m}</td><td class="n">${(m/tot*100).toFixed(1)}%</td></tr>`).join('')}
        <tr class="tot"><td>Shift total</td><td></td><td class="n">${tot}</td><td class="n">100.0%</td></tr>
      </table></div>`; return;
  }
}

function go(k){ if(['timer','unassigned','awaiting'].includes(k)) t0=Date.now(); screen=k; syncNav(); render(); }
function startTimer(k){ timerState=k; t0=Date.now(); screen='timer'; syncNav(); render(); }
function label(id,a){
  const card=document.getElementById('rc'+id);
  card.classList.add(a?'done':'esc');
  document.getElementById('rch'+id).outerHTML = a
    ? `<div class="rev-answer"><span class="swatch" style="${fillOf(a)}"></span>Logged as ${C[a].short}</div>`
    : `<div class="rev-answer" style="color:#7a5c00">⚠ Escalated to supervisor — stays unassigned until reviewed</div>`;
  a?resolved++:escalated++;
  const btn=document.getElementById('coBtn'), note=document.getElementById('escnote');
  btn.textContent = escalated ? `Check Out — ${escalated} to supervisor` : 'Check Out';
  btn.style.background = escalated ? 'var(--warn)' : 'var(--good)';
  btn.style.color = escalated ? '#3d2b00' : '#fff';
  if(resolved+escalated===3) note.innerHTML = escalated
    ? `Your shift closes when your supervisor reviews the ${escalated} remaining block${escalated>1?'s':''}. You're free to go.`
    : `All blocks logged — shift closes immediately.`;
}

const SCREENS=[['checkin','1 · Check In'],['startmodal','2 · Starting activity'],['awaiting','3 · Awaiting order'],
  ['picking','4 · Picking'],['modal','5 · Order complete'],['timer','6 · Activity timer'],
  ['unassigned','7 · Unassigned'],['review','8 · Check-out review'],['supervisor','9 · Supervisor queue'],
  ['summary','10 · Shift summary']];
document.getElementById('nav').innerHTML=SCREENS.map(([k,l])=>
  `<button data-k="${k}" onclick="go('${k}')">${l}</button>`).join('');
function syncNav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===screen));}

setInterval(()=>{
  const el=document.getElementById('tclock');
  if(el) el.textContent=fmt((Date.now()-t0)/1000 + (screen==='unassigned'?272:screen==='awaiting'?840:0));
  const sc=document.getElementById('shiftClock');
  if(sc) sc.textContent='Shift '+fmt(15158+(Date.now()-t0)/1000);
},1000);

ribbon(); syncNav(); render();
</script>
</body>
</html>
